name: Firewall security regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,serve]'
      - run: python -m firewall.coverage --self-test
      # Corpus artifacts are generated separately and are not committed.
      - run: python -m pytest tests/ --ignore=tests/test_dataset_and_regression.py -q
      - run: python -m pip install build
      - run: python -m build
      - name: Verify runtime-only wheel
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('dist').glob('*.whl'))
          with ZipFile(wheel) as archive:
              paths = archive.namelist()
              assert all(path.startswith('firewall/') or '.dist-info/' in path for path in paths)
              assert not any(path.endswith(('.gguf', '.safetensors', '.jsonl', '.log')) for path in paths)
          PYCODE
