[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakybucket-firewall"
version = "1.1.0rc1"
description = "Defense-in-depth security inspection for AI agents and MCP"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22,<5"]

[project.optional-dependencies]
observe = ["aiohttp>=3.13,<4", "PyYAML>=6.0.3,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
serve = ["aiohttp>=3.13,<4"]
tls = ["mitmproxy==12.3.0+leakybucket.2; python_version >= '3.12'", "Brotli>=1.2.1,<1.3; python_version >= '3.12'", "tornado>=6.6,<6.7; python_version >= '3.12'", "pyasn1>=0.6.5,<0.7; python_version >= '3.12'"]
test = ["pytest>=8,<10"]

[project.scripts]
leakybucket = "firewall.__main__:main"
govern = "firewall.__main__:main"
leakybucket-serve = "firewall.serve.__main__:main"
leakybucket-tls = "firewall.transport.tls_cli:main"

[tool.setuptools.packages.find]
include = ["firewall*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
